[project]
name = "auditable-crud"
version = "0.1.0"
description = "Validate, dry-run, approve and audit DML against configured Snowflake tables."
readme = "README.md"
license = "MIT"
# Python 3.11 is shared by the Snowflake container runtime and the stored procedures.
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3",
    "pillow==13.0.0",
    "snowflake-snowpark-python>=1.30",
    "sqlglot==30.17.0",
    "streamlit==1.67.0",
]

[dependency-groups]
dev = [
    "jinja2>=3.1,<4",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package lives next to the Streamlit apps so DCM can ship it as an asset.
packages = ["streamlit/common/auditable_crud"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PL", "D"]
ignore = [
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "PLR0913", # procedure entry points legitimately take many arguments
    "PLR2004", # magic values are fine in tests and thresholds
    "S608",    # SQL is built from validated, quoted identifiers only (see naming.py)
]

[tool.ruff.lint.isort]
known-first-party = ["auditable_crud"]
# The repo has a streamlit/ folder; the import is the third-party library.
known-third-party = ["streamlit"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "S105"]
"streamlit/*/app_pages/**" = ["D100", "N999"]
"streamlit/*/streamlit_app.py" = ["D100"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["streamlit", "tests", "scripts"]
explicit_package_bases = true
mypy_path = "streamlit/common:tests"

[[tool.mypy.overrides]]
module = ["snowflake.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
markers = ["snowflake: integration tests that need a live Snowflake connection (opt-in)"]
